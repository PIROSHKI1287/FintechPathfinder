version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: bpsp_db_local
    environment:
      POSTGRES_USER: bpsp_user
      POSTGRES_PASSWORD: bpsp_local_password
      POSTGRES_DB: bpsp_dev
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bpsp_user -d bpsp_dev']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
